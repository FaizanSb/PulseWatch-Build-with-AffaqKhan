<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PulseWatch AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgmain: "#0F172A",
            card: "#1E293B",
            primary: "#3B82F6"
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body class="bg-bgmain text-white">

  <div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-56 bg-card p-4">
      <h2 class="font-semibold text-lg mb-4">PulseWatch AI</h2>
      <nav class="flex flex-col gap-2 text-sm text-slate-400">
        <a href="#" class="hover:text-white">🏠 Dashboard</a>
        <a href="#" class="hover:text-white">🖥 Servers</a>
        <a href="#" class="hover:text-white">📊 Analytics</a>
        <a href="#" class="hover:text-white">⚠ Alerts</a>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-6">

      <!-- NAVBAR -->
      <header class="bg-card rounded-xl px-5 py-3 flex items-center justify-between">
        <h1 class="font-semibold text-base">PulseWatch Dashboard</h1>

        <div class="flex items-center gap-5 text-sm text-slate-400">
          <span class="flex items-center gap-1 text-green-400">
            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
            Healthy
          </span>

          <span id="currentTime">10:42 AM</span>

          <span>🔔</span>

          <div class="w-8 h-8 rounded-full bg-purple-500 flex items-center justify-center text-xs text-white">
            MF
          </div>
        </div>
      </header>

      <!-- OVERVIEW CARDS -->
      <section class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mt-4">

        <div class="bg-card rounded-xl p-3 text-center">
          <p class="text-xs text-slate-400">CPU</p>
          <p id="cpuValue" class="text-lg font-medium">45%</p>
          <p id="cpuStatus" class="text-[10px] text-green-400">Healthy</p>
        </div>

        <div class="bg-card rounded-xl p-3 text-center">
          <p class="text-xs text-slate-400">RAM</p>
          <p id="ramValue" class="text-lg font-medium">68%</p>
          <p id="ramStatus" class="text-[10px] text-yellow-400">Warning</p>
        </div>

        <div class="bg-card rounded-xl p-3 text-center">
          <p class="text-xs text-slate-400">Disk</p>
          <p id="diskValue" class="text-lg font-medium">72%</p>
          <p id="diskStatus" class="text-[10px] text-green-400">Healthy</p>
        </div>

        <div class="bg-card rounded-xl p-3 text-center">
          <p class="text-xs text-slate-400">Network</p>
          <p id="networkValue" class="text-lg font-medium">125 Mbps</p>
          <p id="networkStatus" class="text-[10px] text-blue-400">Stable</p>
        </div>

        <div class="bg-card rounded-xl p-3 text-center">
          <p class="text-xs text-slate-400">Temp</p>
          <p id="tempValue" class="text-lg font-medium">46°C</p>
          <p id="tempStatus" class="text-[10px] text-green-400">Normal</p>
        </div>

        <div class="bg-card rounded-xl p-3 text-center">
          <p class="text-xs text-slate-400">Uptime</p>
          <p id="uptimeValue" class="text-lg font-medium">5 Days</p>
          <p id="uptimeStatus" class="text-[10px] text-purple-400">Stable</p>
        </div>

      </section>

      <!-- // Chart Section -->
      <div class="bg-card rounded-xl p-4 mt-4">
        <p class="text-xs text-slate-400 mb-2">CPU usage</p>
        <canvas id="cpuChart" height="80"></canvas>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3">
        <div class="bg-card rounded-xl p-4">
          <p class="text-xs text-slate-400 mb-2">RAM usage</p>
          <canvas id="ramChart" height="80"></canvas>
        </div>
        <div class="bg-card rounded-xl p-4">
          <p class="text-xs text-slate-400 mb-2">Network</p>
          <canvas id="networkChart" height="80"></canvas>
        </div>
      </div>

      <div class="bg-card rounded-xl p-4 mt-3">
        <p class="text-xs text-slate-400 mb-2">Disk usage</p>
        <canvas id="diskChart" height="80"></canvas>
      </div>

    </main>

  </div>

  <script>
    // Starting values
    let cpu = 70;
    let ram = 68;
    let disk = 72;
    let network = 125;
    let temp = 46;
    let uptime = 5;
    let history = { cpu: [], ram: [], network: [], disk: [] };

    // Random walk function — value ko chhota sa change deta hai, limits ke andar
    function randomWalk(value, min, max, step) {
      let change = (Math.random() - 0.5) * step;
      let next = value + change;
      if (next < min) next = min;
      if (next > max) next = max;
      return Math.round(next * 10) / 10;
    }

    // Status update — apne threshold ke sath
    function setStatus(elementId, value, threshold) {
      const el = document.getElementById(elementId);
      if (value > threshold) {
        el.textContent = "Warning";
        el.className = "text-[10px] text-yellow-400";
      } else {
        el.textContent = "Healthy";
        el.className = "text-[10px] text-green-400";
      }
    }

     // ---- Reusable chart-maker function ----
  function makeChart(canvasId, color) {
    const ctx = document.getElementById(canvasId).getContext("2d");
    return new Chart(ctx, {
      type: "line",
      data: {
        labels: [],
        datasets: [{
          data: [],
          borderColor: color,
          backgroundColor: color + "22",
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.35,
          fill: true
        }]
      },
      options: {
        responsive: true,
        scales: { x: { display: false }, y: { display: false } },
        plugins: { legend: { display: false } }
      }
    });
  }

  // Ab sirf 1 line se ek chart banta hai
  const cpuChart = makeChart("cpuChart", "#3B82F6");
  const ramChart = makeChart("ramChart", "#8B5CF6");
  const networkChart = makeChart("networkChart", "#22C55E");
  const diskChart = makeChart("diskChart", "#EF4444");

    function updateCards() {
      cpu = randomWalk(cpu, 10, 95, 6);
      ram = randomWalk(ram, 20, 95, 4);
      disk = randomWalk(disk, 30, 98, 1.5);
      network = randomWalk(network, 20, 300, 25);
      temp = randomWalk(temp, 30, 75, 2);

      document.getElementById("cpuValue").textContent = cpu + "%";
      document.getElementById("ramValue").textContent = ram + "%";
      document.getElementById("diskValue").textContent = disk + "%";
      document.getElementById("networkValue").textContent = network + " Mbps";
      document.getElementById("tempValue").textContent = temp + "°C";

      // Status update — apne threshold ke sath
      setStatus("cpuStatus", cpu, 70);
      setStatus("ramStatus", ram, 85);
      setStatus("diskStatus", disk, 90);
      setStatus("networkStatus", network, 100);
      setStatus("tempStatus", temp, 60);

      // History update — sab metrics ke liye
    history.cpu.push(cpu);
    history.ram.push(ram);
    history.network.push(network);
    history.disk.push(disk);

    Object.keys(history).forEach(key => {
      if (history[key].length > 20) history[key].shift();
    });

    // Charts update — reusable loop se
    cpuChart.data.labels = history.cpu.map((_, i) => i);
    cpuChart.data.datasets[0].data = history.cpu;
    cpuChart.update("none");

    ramChart.data.labels = history.ram.map((_, i) => i);
    ramChart.data.datasets[0].data = history.ram;
    ramChart.update("none");

    networkChart.data.labels = history.network.map((_, i) => i);
    networkChart.data.datasets[0].data = history.network;
    networkChart.update("none");

    diskChart.data.labels = history.disk.map((_, i) => i);
    diskChart.data.datasets[0].data = history.disk;
    diskChart.update("none");
  }

    // Har 2000ms (2 second) mein updateCards() chalao
    setInterval(updateCards, 2000);
  </script>

</body>

</html>
